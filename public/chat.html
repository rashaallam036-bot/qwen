<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Qwen — مساعدك الذكي: محادثة، تحليل صور، رسم، وتحويل صوت">
<title>Qwen — مساعدك الذكي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236e5ffb'/%3E%3Cstop offset='1' stop-color='%233fa9f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='800' fill='%23fff' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#0e1013;--panel:#17181c;--panel2:#1b1c21;--border:#2a2b31;--txt:#ececf1;--mut:#9a9ba3;--acc1:#6e5ffb;--acc2:#3fa9f5;--grad:linear-gradient(135deg,var(--acc1),var(--acc2))}
body.light{--bg:#f7f7f8;--panel:#ffffff;--panel2:#f0f0f2;--border:#e2e2e8;--txt:#17171a;--mut:#6b6b70}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;height:100dvh;display:flex;overflow:hidden;transition:background .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#8884;border-radius:3px}
::selection{background:#6e5ffb55}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes glow{0%,100%{box-shadow:0 0 25px #6e5ffb44}50%{box-shadow:0 0 55px #6e5ffb99}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes micp{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
/* السايدبار */
#side{width:270px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;animation:fadeIn .4s}
.logo{display:flex;align-items:center;gap:10px;padding:6px 4px}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--grad);background-size:200% 200%;animation:grad 4s ease infinite,glow 3s infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
.logo b{font-size:19px;background:var(--grad);background-size:200% 200%;animation:grad 4s ease infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{border-color:var(--acc1);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:none;font-weight:600;color:#fff}
#chats{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.cgroup{color:var(--mut);font-size:11px;margin:8px 4px 4px}
.citem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;animation:fadeUp .3s;border:1px solid transparent}
.citem:hover{background:var(--panel2)}
.citem.on{background:var(--panel2);border-color:var(--acc1)}
.citem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem b{opacity:0;color:var(--mut);cursor:pointer}
.citem:hover b{opacity:1}
/* الرئيسي */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border)}
#curModel{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:10px;font-size:14px}
#curModel:hover{background:var(--panel2)}
.sp{flex:1}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
.sw i{width:34px;height:19px;background:#3a3b41;border-radius:20px;position:relative;transition:.2s}
.sw i::after{content:'';position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:2px;right:2px;transition:.2s}
.sw.on i{background:var(--acc1)}.sw.on i::after{right:17px}
.iconbtn{background:none;border:1px solid var(--border);color:var(--mut);width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:15px;transition:.2s;flex-shrink:0}
.iconbtn:hover{color:var(--txt);border-color:var(--acc1);transform:translateY(-1px)}
#menuBtn{display:none}
#stopBtn{display:none;background:#e5484d;border:none;color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;animation:fadeIn .2s}
#chat{flex:1;overflow-y:auto;padding:24px 12px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
/* الترحيب */
#welcome{text-align:center;padding-top:8vh;animation:fadeIn .5s}
#welcome .big{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;background:var(--grad);background-size:200% 200%;animation:grad 4s ease infinite,glow 3s infinite;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
#welcome h1{font-size:27px;margin-bottom:8px;animation:fadeUp .5s .1s both}
#welcome p{color:var(--mut);margin-bottom:26px;animation:fadeUp .5s .2s both}
#sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:0 auto}
#sugg div{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:13px;cursor:pointer;text-align:right;transition:.2s;animation:fadeUp .5s both}
#sugg div:nth-child(1){animation-delay:.25s}#sugg div:nth-child(2){animation-delay:.35s}#sugg div:nth-child(3){animation-delay:.45s}#sugg div:nth-child(4){animation-delay:.55s}
#sugg div:hover{border-color:var(--acc1);transform:translateY(-3px);box-shadow:0 6px 20px #6e5ffb22}
/* الرسائل */
.msg{display:flex;gap:12px;animation:fadeUp .35s ease}
.msg .av{width:32px;height:32px;border-radius:9px;background:var(--grad);background-size:200% 200%;animation:grad 4s ease infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.msg.user{justify-content:flex-end}
.msg.user .bub{background:var(--panel2);border:1px solid var(--border);border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:75%;white-space:pre-wrap}
.msg.ai .body{max-width:92%;line-height:1.8;font-size:15px;min-width:0}
.msg.ai .body img{max-width:100%;border-radius:12px;margin:6px 0}
.msg.ai .body pre{direction:ltr;text-align:left;border-radius:12px;margin:10px 0;position:relative;background:#282c34;overflow-x:auto}
.msg.ai .body table{border-collapse:collapse;margin:10px 0;width:100%}
.msg.ai .body th,.msg.ai .body td{border:1px solid var(--border);padding:7px 10px;font-size:13px}
.msg.ai .body th{background:var(--panel2)}
.msg.ai .body h1,.msg.ai .body h2,.msg.ai .body h3{margin:12px 0 6px}
.msg.ai .body ul,.msg.ai .body ol{padding-right:20px;margin:6px 0}
.acts{display:flex;gap:6px;margin-top:8px;opacity:0;transition:.2s}
.msg.ai:hover .acts{opacity:1}
.acts button{background:none;border:1px solid var(--border);color:var(--mut);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.acts button:hover{color:var(--txt);border-color:var(--acc1)}
.cursor::after{content:'▌';color:var(--acc2);animation:blink 1s infinite}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc2);display:inline-block;margin:0 3px;animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.att img{max-height:110px;border-radius:10px;margin-top:6px}
/* الإدخال */
#inZone{padding:14px 20px 18px}
#attPrev{max-width:820px;margin:0 auto 6px;display:flex;gap:6px}
#attPrev img{height:46px;border-radius:8px;animation:fadeUp .3s}
#inBox{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:10px;transition:.2s;animation:fadeUp .5s .2s both}
#inBox:focus-within{border-color:var(--acc1);box-shadow:0 0 0 3px #6e5ffb22}
#inText{width:100%;background:none;border:none;outline:none;color:var(--txt);resize:none;font-size:15px;max-height:180px;padding:8px 10px;line-height:1.6}
#inBar{display:flex;align-items:center;gap:8px;padding:2px 6px}
#micBtn.live{color:#e5484d;border-color:#e5484d;animation:micp 1s infinite}
#sendBtn{margin-right:auto;background:var(--grad);border:none;width:38px;height:38px;border-radius:12px;color:#fff;font-size:16px;cursor:pointer;transition:.2s}
#sendBtn:hover{transform:scale(1.08)}
#hint{max-width:820px;margin:8px auto 0;text-align:center;color:var(--mut);font-size:11px}
/* الكتالوج */
#catalog{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);z-index:50;overflow-y:auto;padding:40px 20px;display:none}
#catalog.show{display:block;animation:fadeIn .25s}
#catalog .in{max-width:1000px;margin:0 auto}
#catalog h1{font-size:26px;text-align:center;margin-bottom:6px;animation:fadeUp .4s}
#catalog p{text-align:center;color:var(--mut);margin-bottom:20px;animation:fadeUp .4s .1s both}
#catSearch{display:block;margin:0 auto 24px;width:min(400px,90%);background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--txt);padding:11px 16px;outline:none;font-size:14px}
#catSearch:focus{border-color:var(--acc1)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.2s;animation:fadeUp .5s both}
.card:hover{border-color:var(--acc1);transform:translateY(-4px);box-shadow:0 10px 30px #0006}
.card h3{font-size:15px;margin:10px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:10.5px;color:var(--mut)}
.card .ctx{color:var(--mut);font-size:11px;margin-bottom:8px}
.card .desc{font-size:12px;color:var(--mut);margin-bottom:12px;min-height:32px}
.card button{width:100%}
.crown{background:var(--grad);color:#fff;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700}
#closeCat{position:fixed;top:18px;left:18px;z-index:60}
.mlogo{border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
audio{width:100%;margin:8px 0}
/* موبايل */
#sideOverlay{display:none;position:fixed;inset:0;background:#0008;z-index:39}
@media(max-width:768px){
  #side{position:fixed;top:0;bottom:0;right:-290px;z-index:40;transition:right .3s ease;box-shadow:-10px 0 40px #0008}
  #side.open{right:0}
  body.side-open #sideOverlay{display:block;animation:fadeIn .2s}
  #menuBtn{display:inline-block}
  #top{padding:10px 12px}
  #sugg{grid-template-columns:1fr}
  .msg.ai .body{max-width:100%}
  .msg.user .bub{max-width:88%}
  #inZone{padding:10px 12px 14px}
  .sw span{display:none}
}
</style>
</head>
<body>

<div id="sideOverlay" onclick="toggleSide(false)"></div>
<aside id="side">
  <div class="logo"><div class="mk">Q</div><b>Qwen</b></div>
  <button class="btn primary" onclick="newChat();toggleSide(false)">＋ محادثة جديدة</button>
  <button class="btn" onclick="toggleCatalog(true);toggleSide(false)">🗂 استعراض النماذج</button>
  <div class="cgroup">💬 المحادثات</div>
  <div id="chats"></div>
</aside>

<main id="main">
  <div id="top">
    <button class="iconbtn" id="menuBtn" title="القائمة" onclick="toggleSide()">☰</button>
    <div id="curModel" onclick="toggleCatalog(true)"></div>
    <div class="sp"></div>
    <div class="sw" id="searchSw" onclick="this.classList.toggle('on')"><i></i> <span>بحث وب</span></div>
    <button class="iconbtn" title="تحميل المحادثة" onclick="dlChat()">⬇</button>
    <button class="iconbtn" title="الوضع الفاتح/الداكن" onclick="toggleTheme()">🌓</button>
    <button id="stopBtn" onclick="stopGen()">⏹ إيقاف</button>
  </div>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <div id="inZone">
    <div id="attPrev"></div>
    <div id="inBox">
      <textarea id="inText" rows="1" placeholder="ابعت رسالة لـ Qwen..."></textarea>
      <div id="inBar">
        <button class="iconbtn" id="micBtn" title="إملاء صوتي" onclick="mic()">🎙</button>
        <button class="iconbtn" id="attBtn" title="إرفاق" onclick="attClick()">📎</button>
        <input type="file" id="attFile" hidden multiple>
        <button id="sendBtn" title="إرسال" onclick="send()">➤</button>
      </div>
    </div>
    <div id="hint">Qwen ممكن يغلط أحياناً — تحقق من المعلومات المهمة · مدعوم بـ DashScope</div>
  </div>
</main>

<div id="catalog">
  <button class="btn" id="closeCat" onclick="toggleCatalog(false)">✕ إغلاق</button>
  <div class="in">
    <h1>Building AI Products with <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Qwen</span></h1>
    <p>نماذجنا الرائدة — اختار النموذج وابدأ فوراً</p>
    <input id="catSearch" placeholder="🔍 ابحث عن نموذج..." oninput="renderCards(this.value)">
    <div id="cards"></div>
  </div>
</div>

<script>
/* ═══════════ 🔑 الإعدادات ═══════════ */
/* المفتاح محمي على السيرفر — كل الطلبات بتعدي على البروكسي /api/qwen */
const BASE = "/api/qwen";
const SYS = "أنت Qwen، مساعد ذكي ودود ومحترف. طابق لغة المستخدم (مصري/فصحى)، كن مباشراً بدون حشو، نسّق بـ Markdown (عناوين، قوائم، جداول، أكواد)، اعترف لو مش متأكد.";

/* ═══════════ 🧠 النماذج ═══════════ */
const G={flag:['#6e5ffb','#3fa9f5'],chat:['#4f46e5','#7c3aed'],vision:['#0ea5e9','#22d3ee'],omni:['#f59e0b','#ef4444'],asr:['#10b981','#14b8a6'],tts:['#ec4899','#f43f5e'],image:['#8b5cf6','#d946ef'],edit:['#a855f7','#6366f1']};
const GL={flag:'✦',chat:'Q',vision:'V',omni:'O',asr:'A',tts:'T',image:'I',edit:'E'};
const M=(id,cat,inp,out,ctx,desc,flag)=>({id,cat,inp,out,ctx,desc,flag});
const MODELS=[
 M('qwen3.8-max','flag',['نص','صورة','فيديو'],['نص'],'1,000,000','الجيل الأحدث والأقوى — نفس عقل الشات الحالي',1),
 M('qwen3.7-max','chat',['نص'],['نص'],'1,000,000','النموذج القيادي للمهام المعقدة'),
 M('qwen3.7-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','متعدد الوسائط متوازن وسريع'),
 M('qwen3.6-max-preview','chat',['نص'],['نص'],'262,144','معاينة الجيل الجديد'),
 M('qwen3.6-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','ذكاء عالي بتكلفة أقل'),
 M('qwen3.5-plus','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','سريع وذكي للاستخدام اليومي'),
 M('qwen3.5-flash','vision',['نص','صورة','فيديو'],['نص'],'1,000,000','الأخف والأسرع'),
 M('qwen3-max','chat',['نص'],['نص'],'262,144','الجيل الثالث الرائد'),
 M('qwen3-vl-plus','vision',['نص','صورة','فيديو'],['نص'],'131,027','فهم صور وفيديو بدقة عالية'),
 M('qwen3-vl-flash','vision',['نص','صورة','فيديو'],['نص'],'131,027','رؤية سريعة وخفيفة'),
 M('qwen3-omni-flash','omni',['نص','صورة','صوت','فيديو'],['نص','صوت'],'65,536','يفهم كل شيء ويرد صوتاً'),
 M('qwen3-asr-flash','asr',['صوت'],['نص'],'—','تحويل الكلام إلى نص بدقة'),
 M('qwen3-tts-flash','tts',['نص'],['صوت'],'—','تحويل النص إلى كلام طبيعي'),
 M('qwen-image-2.0-pro','image',['نص','صورة'],['صورة'],'—','رسم احترافي بدقة 2K'),
 M('qwen-image-2.0','image',['نص','صورة'],['صورة'],'—','رسم بتفاصيل واقعية'),
 M('qwen-image-plus','image',['نص'],['صورة'],'—','توليد صور من النص'),
 M('qwen-image-edit','edit',['نص','صورة'],['صورة'],'—','تعديل الصور بالأوامر'),
];
let cur=MODELS[0], chats=[], chatId=null, apiHist=[], atts=[], aborter=null, busy=false;
const $=id=>document.getElementById(id);
const logo=(m,s=26)=>`<div class="mlogo" style="width:${s}px;height:${s}px;font-size:${s*0.5}px;background:linear-gradient(135deg,${G[m.cat][0]},${G[m.cat][1]})">${GL[m.cat]}</div>`;
const isChat=m=>['flag','chat','vision','omni'].includes(m.cat);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
marked.setOptions({gfm:true,breaks:true});

/* ═══════════ 💾 الحفظ ═══════════ */
function save(){ localStorage.setItem('qwen_chats',JSON.stringify(chats)); localStorage.setItem('qwen_model',cur.id); localStorage.setItem('qwen_theme',document.body.classList.contains('light')?'1':'0'); }
function loadAll(){
  try{ chats=JSON.parse(localStorage.getItem('qwen_chats')||'[]'); }catch(e){ chats=[]; }
  const mid=localStorage.getItem('qwen_model'); if(mid) cur=MODELS.find(m=>m.id===mid)||MODELS[0];
  if(localStorage.getItem('qwen_theme')==='1') document.body.classList.add('light');
}
function toggleTheme(){ document.body.classList.toggle('light'); save(); }
function toggleSide(v){
  const open = v===undefined ? !$('side').classList.contains('open') : v;
  $('side').classList.toggle('open',open);
  document.body.classList.toggle('side-open',open);
}

/* ═══════════ 🗂 المحادثات ═══════════ */
function newChat(){ chatId=null; apiHist=[]; atts=[]; renderAtt(); renderChats(); $('wrap').innerHTML=''; welcome(); adaptInput(); }
function renderChats(){
  $('chats').innerHTML = chats.map(c=>`<div class="citem ${c.id===chatId?'on':''}" onclick="loadChat('${c.id}')"><span>💬 ${esc(c.title)}</span><b onclick="event.stopPropagation();delChat('${c.id}')">✕</b></div>`).join('')||'<div style="color:var(--mut);font-size:12px;padding:8px">مفيش محادثات لسه</div>';
}
function loadChat(id){
  const c=chats.find(x=>x.id===id); if(!c) return;
  chatId=id; apiHist=c.messages.map(m=>({role:m.role,content:[{type:'text',text:m.text}]}));
  atts=[]; renderAtt(); renderChats(); $('wrap').innerHTML='';
  c.messages.forEach(m=> m.role==='user'? addUser(m.text,[]) : addAIFinal(m.text,m.model));
  adaptInput(); toggleSide(false);
}
function delChat(id){ chats=chats.filter(c=>c.id!==id); if(chatId===id) newChat(); save(); renderChats(); }
function ensureChat(firstText){
  if(chatId) return;
  chatId=Date.now()+'';
  chats.unshift({id:chatId,title:firstText.slice(0,30)||'محادثة',messages:[]});
  renderChats();
}
function pushMsg(role,text,model){ const c=chats.find(x=>x.id===chatId); if(c){ c.messages.push({role,text,model}); save(); } }

/* ═══════════ 🖥 الواجهة ═══════════ */
function renderSide(){ $('curModel').innerHTML=logo(cur,22)+`<span>${cur.id}</span> <span style="color:var(--mut)">▾</span>`; }
function renderCards(q=''){
  const list=MODELS.filter(m=>m.id.includes(q.toLowerCase())||m.desc.includes(q));
  $('cards').innerHTML=list.map((m,i)=>`
   <div class="card" style="animation-delay:${i*40}ms">${logo(m,38)}
     <h3>${m.id} ${m.flag?'<span class="crown">FLAGSHIP</span>':''}</h3>
     <div class="tags">${m.inp.map(x=>`<span class="tag">⬅ ${x}</span>`).join('')}${m.out.map(x=>`<span class="tag">➡ ${x}</span>`).join('')}</div>
     <div class="ctx">📏 سياق: ${m.ctx}</div>
     <div class="desc">${m.desc}</div>
     <button class="btn primary" onclick="pick('${m.id}');toggleCatalog(false)">استخدام النموذج</button>
   </div>`).join('');
}
function toggleCatalog(v){ $('catalog').classList.toggle('show',v); if(v) renderCards(); }
function pick(id){ cur=MODELS.find(m=>m.id===id); atts=[]; renderAtt(); renderSide(); adaptInput(); save(); }
function adaptInput(){
  const ph={chat:'ابعت رسالة لـ Qwen...',flag:'اسألني أي حاجة — أنا Qwen3.8-Max 👑',vision:'اسأل أو أرفق صورة للتحليل...',omni:'نص أو صورة أو صوت...',image:'صف الصورة اللي عايز ترسمها...',edit:'اكتب التعديل وارفق الصورة...',tts:'اكتب النص اللي عايز تسمعه...',asr:'اضغط 📎 وارفق ملف صوتي للتفريغ...'};
  $('inText').placeholder=ph[cur.cat]||'...';
  $('attBtn').style.display=cur.cat==='chat'?'none':'inline-block';
}
function welcome(){
  $('wrap').innerHTML=`<div id="welcome"><div class="big">✦</div>
   <h1>أهلاً بيك، أنا <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Qwen</span></h1>
   <p>اسأل، حلّل صور، ارسم، حوّل صوت — كل النماذج تحت أمرك</p>
   <div id="sugg">
     <div onclick="useS(this)">اشرحلي الحوسبة الكمومية ببساطة مع مثال</div>
     <div onclick="useS(this)">اكتبلي سكربت بايثون ينظم ملفاتي</div>
     <div onclick="useS(this)">قارنلي بين بايثون وجافاسكريبت في جدول</div>
     <div onclick="useS(this)">ارسم مدينة عربية قديمة وقت الغروب</div>
   </div></div>`;
}
function useS(el){ $('inText').value=el.textContent; send(); }

/* ═══════════ 📎 مرفقات + 🎙 مايك ═══════════ */
function attClick(){ $('attFile').accept=cur.cat==='asr'?'audio/*':(cur.cat==='tts'?'':'image/*,audio/*'); $('attFile').click(); }
$('attFile').onchange=async e=>{
  for(const f of e.target.files){
    const d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f);});
    atts.push({type:f.type.startsWith('audio')?'audio':'image',data:d,mime:f.type});
  }
  renderAtt(); e.target.value='';
};
function renderAtt(){ $('attPrev').innerHTML=atts.map(a=>a.type==='image'?`<img src="${a.data}" alt="مرفق">`:`<span class="tag">🎙 صوت</span>`).join(''); }
let rec=null;
function mic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return alert('متصفحك مش داعم الإملاء الصوتي');
  if(rec){ rec.stop(); rec=null; $('micBtn').classList.remove('live'); return; }
  rec=new SR(); rec.lang='ar-EG'; rec.interimResults=true;
  $('micBtn').classList.add('live');
  rec.onresult=e=>{ $('inText').value=Array.from(e.results).map(r=>r[0].transcript).join(''); };
  rec.onend=()=>{ rec=null; $('micBtn').classList.remove('live'); };
  rec.start();
}

/* ═══════════ 🚀 الإرسال ═══════════ */
async function send(){
  if(busy) return;
  const txt=$('inText').value.trim();
  if(!txt&&!atts.length) return;
  $('inText').value=''; $('inText').style.height='auto';
  const w=$('welcome'); if(w) w.remove();
  if(cur.cat==='image'||cur.cat==='edit') return genImage(txt);
  if(cur.cat==='tts') return tts(txt);
  if(cur.cat==='asr') return asr();
  return chat(txt);
}
function stopGen(){ if(aborter) aborter.abort(); }

async function chat(txt){
  busy=true; $('stopBtn').style.display='inline-block';
  ensureChat(txt);
  addUser(txt,atts);
  const content=[];
  atts.forEach(a=> a.type==='image'? content.push({type:'image_url',image_url:{url:a.data}}) : content.push({type:'input_audio',input_audio:{data:a.data.split(',')[1],format:(a.mime.split('/')[1]||'wav').replace('mpeg','mp3')}}));
  if(txt) content.push({type:'text',text:txt});
  apiHist.push({role:'user',content});
  pushMsg('user',txt);
  atts=[]; renderAtt();
  const aiEl=addAI();
  aiEl.querySelector('.body').innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  aborter=new AbortController();
  let full='';
  try{
    const resp=await fetch(BASE+'/compatible-mode/v1/chat/completions',{method:'POST',signal:aborter.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:cur.id,messages:[{role:'system',content:SYS},...apiHist],stream:true,temperature:0.7,enable_search:$('searchSw').classList.contains('on')})});
    if(!resp.ok){ const j=await resp.json().catch(()=>({})); throw new Error(j.error||j.message||('HTTP '+resp.status)); }
    const rd=resp.body.getReader(),dc=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await rd.read(); if(done) break;
      buf+=dc.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data:')) continue;
        const d=ln.slice(5).trim(); if(d==='[DONE]') continue;
        try{ full+=JSON.parse(d).choices?.[0]?.delta?.content||''; }catch(e){}
      }
      if(full) paint(aiEl,full,true);
    }
  }catch(e){ if(e.name!=='AbortError') full+=`\n\n⚠️ خطأ: ${e.message}`; }
  paint(aiEl,full,false);
  addActs(aiEl,full);
  apiHist.push({role:'assistant',content:[{type:'text',text:full}]});
  pushMsg('assistant',full,cur.id);
  busy=false; $('stopBtn').style.display='none'; aborter=null;
}
function paint(el,txt,live){
  el.querySelector('.body').innerHTML=marked.parse(txt)+(live?'<span class="cursor"></span>':'');
  el.querySelectorAll('pre code').forEach(c=>hljs.highlightElement(c));
  $('chat').scrollTop=1e9;
}
function addUser(txt,at){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="bub">${esc(txt)}${at&&at.length?'<div class="att">'+at.map(a=>a.type==='image'?`<img src="${a.data}" alt="مرفق">`:'🎙').join('')+'</div>':''}</div>`;
  $('wrap').appendChild(d); $('chat').scrollTop=1e9;
}
function addAI(){
  const d=document.createElement('div'); d.className='msg ai';
  d.innerHTML=`${logo(cur,32)}<div style="min-width:0"><div class="body"></div></div>`;
  $('wrap').appendChild(d); return d;
}
function addAIFinal(txt,modelId){
  const m=MODELS.find(x=>x.id===modelId)||cur;
  const d=document.createElement('div'); d.className='msg ai';
  d.innerHTML=`${logo(m,32)}<div style="min-width:0"><div class="body"></div></div>`;
  $('wrap').appendChild(d);
  paint(d,txt,false); addActs(d,txt);
}
function addActs(el,txt){
  const a=document.createElement('div'); a.className='acts';
  a.innerHTML=`<button onclick="copyMsg(this)">📋 نسخ</button><button onclick="speak(this)">🔊 نطق</button><button onclick="regen()">🔄 إعادة</button>`;
  a.dataset.txt=txt;
  el.querySelector('.body').parentNode.appendChild(a);
}
function copyMsg(b){ navigator.clipboard.writeText(b.parentNode.dataset.txt); b.textContent='✓ تم'; setTimeout(()=>b.textContent='📋 نسخ',1200); }
function speak(b){
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
  const u=new SpeechSynthesisUtterance(b.parentNode.dataset.txt.replace(/[#*`_>\[\]()!]/g,' '));
  u.lang='ar-EG'; speechSynthesis.speak(u);
}
function regen(){
  if(busy||!apiHist.length) return;
  while(apiHist.length&&apiHist[apiHist.length-1].role==='assistant') apiHist.pop();
  const c=chats.find(x=>x.id===chatId); if(c) while(c.messages.length&&c.messages[c.messages.length-1].role==='assistant') c.messages.pop();
  const last=[...$('wrap').children].filter(e=>e.classList.contains('ai')).pop(); if(last) last.remove();
  const lastUser=apiHist[apiHist.length-1];
  const txt=lastUser?.content?.find(x=>x.type==='text')?.text||'';
  apiHist.pop(); if(c) c.messages.pop();
  chat(txt);
}
function dlChat(){
  const c=chats.find(x=>x.id===chatId); if(!c) return alert('مفيش محادثة للتحميل');
  const md=`# ${c.title}\n\n`+c.messages.map(m=>`**${m.role==='user'?'أنت':'Qwen'}:**\n${m.text}\n`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
  a.download=c.title+'.md'; a.click();
}

/* ── 🎨 رسم الصور ── */
async function genImage(txt){
  busy=true; ensureChat(txt); addUser(txt,atts); pushMsg('user',txt);
  const aiEl=addAI(); aiEl.querySelector('.body').innerHTML='🎨 جاري الرسم... <span class="cursor"></span>';
  try{
    const isEdit=cur.cat==='edit';
    const url=isEdit? BASE+'/api/v1/services/aigc/multimodal-generation/generation' : BASE+'/api/v1/services/aigc/text2image/image-synthesis';
    const body=isEdit? {model:cur.id,input:{messages:[{role:'user',content:[...atts.filter(a=>a.type==='image').map(a=>({image:a.data})),{text:txt}]}]}}
                     : {model:cur.id,input:{prompt:txt},parameters:{size:'1024*1024'}};
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-DashScope-Async':'enable'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.output?.task_id) throw new Error(j.error||j.message||JSON.stringify(j));
    let out=null;
    while(true){
      await new Promise(r2=>setTimeout(r2,2500));
      const t=await (await fetch(BASE+'/api/v1/tasks/'+j.output.task_id)).json();
      if(t.output.task_status==='SUCCEEDED'){ out=t.output; break; }
      if(t.output.task_status==='FAILED') throw new Error(t.output.message||'فشل التوليد');
    }
    const urls=out.results?.map(x=>x.url)||out.choices?.flatMap(c=>c.message.content).filter(x=>x.image).map(x=>x.image)||[];
    aiEl.querySelector('.body').innerHTML=urls.map(u=>`<img src="${u}" alt="صورة مولدة"><br><a href="${u}" target="_blank" class="tag">⬇ تحميل</a>`).join('')||'⚠️ مفيش نتيجة';
    pushMsg('assistant','[صورة مولدة] '+txt,cur.id);
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+esc(e.message); }
  busy=false; atts=[]; renderAtt(); $('chat').scrollTop=1e9;
}

/* ── 🔊 نص لصوت ── */
async function tts(txt){
  busy=true; ensureChat(txt); addUser(txt,[]); pushMsg('user',txt);
  const aiEl=addAI(); aiEl.querySelector('.body').innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  try{
    const r=await fetch(BASE+'/compatible-mode/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:cur.id,input:txt,voice:'Cherry'})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).message||'خطأ');
    const u=URL.createObjectURL(await r.blob());
    aiEl.querySelector('.body').innerHTML=`<audio controls src="${u}"></audio><br><a href="${u}" download="qwen-audio.mp3" class="tag">⬇ تحميل</a>`;
    pushMsg('assistant','[صوت مولود] '+txt,cur.id);
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+esc(e.message); }
  busy=false; $('chat').scrollTop=1e9;
}

/* ── 🎙 صوت لنص ── */
async function asr(){
  busy=true; ensureChat('تفريغ صوتي'); addUser('🎙 [ملف صوتي]',atts); pushMsg('user','[رسالة صوتية]');
  const aiEl=addAI(); aiEl.querySelector('.body').innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  try{
    if(!atts.length) throw new Error('ارفق ملف صوتي الأول بالزر 📎');
    const fd=new FormData();
    fd.append('file',await (await fetch(atts[0].data)).blob(),'audio.ogg');
    fd.append('model',cur.id);
    const r=await fetch(BASE+'/compatible-mode/v1/audio/transcriptions',{method:'POST',body:fd});
    const j=await r.json(); if(!j.text) throw new Error(j.error||j.message||'خطأ');
    paint(aiEl,j.text,false); addActs(aiEl,j.text);
    pushMsg('assistant',j.text,cur.id);
    atts=[]; renderAtt();
  }catch(e){ aiEl.querySelector('.body').innerHTML='⚠️ '+esc(e.message); }
  busy=false; $('chat').scrollTop=1e9;
}

/* اختصارات */
$('inText').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';});
$('inText').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent?.isComposing&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send();}
});

/* بدء */
loadAll(); renderSide(); renderChats(); adaptInput();
if(chats.length) loadChat(chats[0].id); else welcome();
</script>
